<mat-toolbar color="primary">
    <a routerLink="/"> {{ nomeLoja | uppercase}} </a>
    <span class="flex-spacer"></span>
    <button mat-button routerLink="Home">Home</button>
     <button mat-button routerLink="/produtos"> Produtos</button>
     <button mat-button routerLink="/carrinho"> Carrinho {{ quantidade() }}</button>
     <button mat-button routerLink="/checkout"> Checkout</button>
     <button mat-button routerLink="/admin">Admin</button>
    <button mat-button routerLink="/favoritos">Favoritos</button>
    @if(usuarioLogado()){
        <span class="email-header"> {{usuarioAtual()?.email}}</span>
        <button  class="btn-sair" mat-button type="button" (click)="sair()">Sair</button>
    }@else {
        <button class="btn-entrar" mat-button type="button" routerLink="/login">Entrar</button>
    }
</mat-toolbar>
